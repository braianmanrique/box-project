<div style="display:flex;gap:16px;">
  <aside style="width:220px;border-right:1px solid #eee;padding:16px;">
    <div style="font-weight:700;margin-bottom:8px;">
      {{ auth.user()?.fullName }}
    </div>
    <div style="font-size:12px;color:#666;margin-bottom:16px;">
      Rol: {{ auth.user()?.role }}
    </div>

    <nav style="display:flex;flex-direction:column;gap:8px;">
      <a routerLink="/user">User Home</a>
      <a routerLink="/admin" *ngIf="auth.role() === 'admin'">Admin Home</a>
      <a routerLink="/members" *ngIf="auth.role() === 'admin'">Members</a>
    </nav>

    <button (click)="logout()" style="margin-top:20px;">Salir</button>
  </aside>

  <main style="flex:1;padding:16px;">
    <router-outlet />
  </main>
</div>

<div class="auth-page">
  <div class="auth-bg">
    <div class="auth-blur blob-1"></div>
    <div class="auth-blur blob-2"></div>
  </div>

  <section class="auth-card">
    <header class="auth-header">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">
          <h1>Gym Manager</h1>
          <p>Gestiona miembros, staff, ventas y operaciones en un solo lugar.</p>
        </div>
      </div>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="username">Usuario</label>
        <div class="control">
          <input id="username" type="text" autocomplete="username" placeholder="Escribe tu usuario"
            formControlName="username"
            [class.invalid]="form.controls.username.touched && form.controls.username.invalid" />
        </div>
        <small class="hint" *ngIf="form.controls.username.touched && form.controls.username.invalid">
          El usuario es obligatorio.
        </small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="control">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password"
            placeholder="Escribe contraseña" formControlName="password"
            [class.invalid]="form.controls.password.touched && form.controls.password.invalid" />

          <button type="button" class="icon-btn" (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <small class="hint" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          La contraseña es obligatoria.
        </small>
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" [checked]="rememberMe()" (change)="rememberMe.set(!rememberMe())" />
          Mantener sesión
        </label>

        <a class="link" href="#" (click)="$event.preventDefault()">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="primary" type="submit" [disabled]="isSubmitting()">
        <span *ngIf="!isSubmitting()">Entrar</span>
        <span *ngIf="isSubmitting()">Validando…</span>
      </button>

      <div class="error" *ngIf="error() as e">
        <div class="error-title">No se pudo iniciar sesión</div>
        <div class="error-msg">{{ e }}</div>
      </div>
    </form>

    <div class="auth-footer">
      <span> 2026</span>
      <span class="dot"></span>
    </div>
  </section>
</div>
